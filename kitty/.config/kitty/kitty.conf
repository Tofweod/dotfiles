include ~/.cache/wal/colors-kitty.conf

env TERM xterm-256color

shell /usr/bin/zsh
editor /usr/bin/vim

font_size 14.0

notify_on_cmd_finish unfocused

disable_ligatures always
# font_family      family="monospace"
# bold_font        auto
# italic_font      auto
# bold_italic_font auto


tab_bar_style powerline
tab_powerline_style angled

mouse_hide_wait 1.5

copy_on_select clipboard
clear_selection_on_clipboard_loss yes

shell_integration enabled

repaint_delay 6
sync_to_monitor yes

kitty_mod ctrl+shift
map ctrl+enter launch  --type=os-window --cwd=current

map kitty_mod+q focus_visible_window
map kitty_mod+j next_window
map kitty_mod+k previous_window

map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+0 goto_last_tab
map kitty_mod+x close_tab

map kitty_mod+l next_layout
map kitty_mod+r combine : load_config_file : launch --type=overlay dunstify "Kitty config reloaded"


# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
