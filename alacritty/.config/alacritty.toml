[env]
TERM = "xterm-256color"

[font]
size = 12

[font.bold]
family = "Maple Mono NL NF CN"
style = "Bold"

[font.bold_italic]
family = "Maple Mono NL NF CN"
style = "Bold Italic"

[font.italic]
family = "Maple Mono NL NF CN"
style = "Italic"

[font.normal]
family = "Maple Mono NL NF CN"
style = "Regular"

[window.dimensions]
columns = 90
lines = 28

[keyboard]
bindings = [
   { key = "Return", mods = "Control", action = "SpawnNewInstance" }
]
# BEGIN WAL
[colors.primary]
background = '#18191b'
foreground = '#c5c5c6'

[colors.cursor]
text   = '#18191b' # Apply background color to color of text inside cursor
cursor = '#c5c5c6' # Apply foreground color to color of cursor

[colors.vi_mode_cursor]
text    = '#18191b' # Same as above
cursor  = '#c5c5c6'

[colors.search.matches]
foreground = '#18191b' # Same as above
background = '#c5c5c6' # Apply bright/white color to bg color of matching search

[colors.search.focused_match]
foreground = 'CellBackground'
background = 'CellForeground'

[colors.line_indicator]
foreground = 'None'
background = 'None'

[colors.footer_bar]
foreground = '#515254'
background = '#c5c5c6'

[colors.selection]
text       = 'CellBackground'
background = 'CellForeground'

[colors.normal]
black   = '#18191b'
red     = '#45516d'
green   = '#5c586c'
yellow  = '#52617b'
blue    = '#76798c'
magenta = '#909dba'
cyan    = '#a4b4c9'
white   = '#c5c5c6'

[colors.bright]
black   = '#515254'
red     = '#45516d'
green   = '#5c586c'
yellow  = '#52617b'
blue    = '#76798c'
magenta = '#909dba'
cyan    = '#a4b4c9'
white   = '#c5c5c6'
# END WAL
